[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 256 }

# DeployLocal.s.sol writes addresses to deployments/local.json so step 5's
# Go binaries can read them.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Strict warnings - flag unused returns, deprecated calls, etc. Treat
# warnings as errors in CI by adding --deny-warnings to forge build.
deny_warnings = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"

[fuzz]
runs = 256
