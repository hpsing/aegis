name: Deploy SPA to GitHub Pages

# Builds web/ with the GH-Pages base path and publishes the static
# bundle to the github-pages environment. The SPA reads its API
# endpoint from localStorage at runtime — operators paste a
# cloudflared tunnel URL via the header pill, no rebuild needed.

on:
  push:
    branches: [main]
    paths:
      # Only re-build when something the SPA cares about changed.
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

# Allow only one concurrent deployment, skipping runs queued between
# the in-progress run and the latest queued run.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          # GH Pages serves at https://<user>.github.io/<repo>/ — the
          # asset URLs in index.html need that prefix. Repo name comes
          # from the `repository` context (e.g. "user/aegis" → "/aegis/").
          VITE_GH_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
